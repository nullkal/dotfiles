packages:
  ubuntu:
    apt_repos: []
    apt:
      - build-essential
      - pkg-config
      - libssl-dev
      - git
      - curl
      - tmux
      - zsh
      - neovim
  darwin:
    brew:
      - git
      - curl
      - tmux
      - zsh
      - neovim
      # Required by Sheldon's libssh2 dependency when building with Cargo.
      - openssl@3
