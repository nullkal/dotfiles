add_newline = false
format = '[\[$username@$hostname $directory\]${env_var.STARSHIP_PROMPT_SYMBOL}](yellow) '
right_format = '[\[](yellow)[$time](red)[\]](yellow)'

[username]
show_always = true
format = '$user'

[hostname]
ssh_only = false
trim_at = '.'
format = '$hostname'

[directory]
truncation_length = 1
truncate_to_repo = false
format = '$path'

[env_var.STARSHIP_PROMPT_SYMBOL]
default = '%'
format = '$env_value'

[time]
disabled = false
time_format = '%H:%M:%S'
format = '$time'
